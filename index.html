// 12-week periodization: 3 blocks of 4 weeks (3 build + 1 deload)
// Percentages based on target maxes for progressive overload toward goals
function getBenchScheme(week) {
  // Target: 225. Training max starts ~200, progresses to ~215
  var tm = week<=4?200:week<=8?208:215;
  return getScheme(week,tm);
}
function getSquatScheme(week) {
  // Target: 315. Training max starts ~280, progresses to ~300
  var tm = week<=4?280:week<=8?290:300;
  return getScheme(week,tm);
}
function getDeadliftScheme(week) {
  // Target: 405. Training max starts ~340, progresses to ~370
  var tm = week<=4?340:week<=8?355:370;
  return getScheme(week,tm);
}
function getScheme(week,tm) {
  var wk = ((week-1)%4)+1; // 1-4 within block
  if(wk===1) return {label:"5×5 @ "+Math.round(tm*0.75)+" lbs",detail:"5 sets of 5 reps at 75% TM. Build volume.",pct:75};
  if(wk===2) return {label:"4×4 @ "+Math.round(tm*0.80)+" lbs",detail:"4 sets of 4 reps at 80% TM. Moderate intensity.",pct:80};
  if(wk===3) return {label:"5×3 @ "+Math.round(tm*0.85)+" lbs + AMRAP",detail:"4 sets of 3 at 85% TM, then 1 AMRAP set. Push the last set.",pct:85};
  return {label:"3×5 @ "+Math.round(tm*0.65)+" lbs (deload)",detail:"Deload week. Light weight, focus on form. Recover.",pct:65};
}

function getPullupScheme(week) {
  // Progressive overload: increase total volume, add weighted sets
  var wk = ((week-1)%4)+1;
  if(week<=4) {
    if(wk===4) return {label:"3×12 bodyweight (deload)",detail:"Easy week. Focus on smooth reps."};
    return {label:(3+wk)+"×max BW + 3×8 weighted (+10 lbs)",detail:"Do "+(3+wk)+" max sets bodyweight (rest 2 min between), then 3 weighted sets. Target total reps: "+(60+week*5)+"+"};
  }
  if(week<=8) {
    if(wk===4) return {label:"3×15 bodyweight (deload)",detail:"Easy week."};
    return {label:(4+wk)+"×max BW + 3×6 weighted (+15 lbs)",detail:"Volume is climbing. "+(4+wk)+" max sets bodyweight, then 3 weighted sets at +15 lbs. Target: "+(80+week*3)+"+ total."};
  }
  if(wk===4) return {label:"3×15 bodyweight (deload)",detail:"Light week before the final push."};
  return {label:(5+wk)+"×max BW + 4×5 weighted (+20 lbs)",detail:"Peak pull-up volume. "+(5+wk)+" max BW sets, 4 weighted sets. You should be approaching 25+ unbroken by now."};
}

// 3 runs/week, capped for tendonitis management

function getWeekPlan(weekIdx) {
  var w = weekIdx;
  var blockWk = ((w)%4)+1;
  var block = w<4?1:w<8?2:3;
  var phase = blockWk===4?"Deload":block===1?"Foundation":block===2?"Build":block===3?"Peak":"";
  var rp = RUN_PLANS[w];
  var days = [
    {day:"Mon",type:"lift",liftType:"upper_push",desc:LIFT_DAYS.upper_push.name,detail:""},
    rp.runs[0], // Tue run
    {day:"Wed",type:"lift",liftType:"lower",desc:LIFT_DAYS.lower.name,detail:""},
    rp.runs[1], // Thu run
    {day:"Fri",type:"lift",liftType:"upper_pull",desc:LIFT_DAYS.upper_pull.name,detail:""},
    rp.runs[2], // Sat run
  ];
  return {week:w+1,phase:phase,block:block,runMiles:rp.mi,days:days};
}

  var lbl={fontSize:10,fontWeight:700,color:C.textMuted,marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:1};

      h("div",null,h("label",{style:lbl},"Avg Pace / Weight"),h("input",{type:"text",placeholder:"9:27 or 205 lbs",value:pace,onChange:function(e){setPace(e.target.value)},style:inp}))

        })
      )
    ),
    h("div",{style:{marginBottom:12}},h("label",{style:lbl},"Notes"),h("textarea",{placeholder:"How did it feel?",value:notes,onChange:function(e){setNotes(e.target.value)},style:Object.assign({},inp,{minHeight:56,resize:"vertical"})})),
    h("div",{style:{display:"flex",gap:8}},
      h("button",{onClick:function(){p.onSave({distance:parseFloat(dist)||0,pace:pace,effort:effort,notes:notes,completedAt:ex?ex.completedAt:new Date().toISOString()})},style:{flex:1,padding:"9px 0",fontSize:13,fontWeight:700,background:C.accent,color:"#111",border:"none",borderRadius:6}},ex?"Update":"Log Workout"),
      ex?h("button",{onClick:p.onDelete,style:{padding:"9px 14px",fontSize:13,fontWeight:600,background:"transparent",color:C.red,border:"1px solid "+C.redDim,borderRadius:6}},"Remove"):null,
      h("button",{onClick:p.onCancel,style:{padding:"9px 14px",fontSize:13,fontWeight:500,background:C.card,color:C.textMuted,border:"none",borderRadius:6}},"Cancel")
    )
  );
}

function LiftDetail(p) {
  var lt=LIFT_DAYS[p.liftType];
  var week=p.week;
  var mainScheme=null;
  if(p.liftType==="upper_push") mainScheme={bench:getBenchScheme(week)};
  else if(p.liftType==="lower") mainScheme={squat:getSquatScheme(week),deadlift:getDeadliftScheme(week)};
  else if(p.liftType==="upper_pull") mainScheme={pullups:getPullupScheme(week)};

  return h("div",{style:{fontSize:13,lineHeight:1.6,color:C.textMuted}},
    h("div",{style:{fontSize:11,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Warmup"),
    h("div",{style:{marginBottom:12,color:"#999"}},lt.warmup),
    h("div",{style:{fontSize:11,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Exercises"),
    lt.exercises.map(function(ex,i){
      var isMain=ex.name==="Bench Press"||ex.name==="Back Squat"||ex.name==="Deadlift"||ex.name==="Pull-ups";
      var scheme=null;
      if(ex.name==="Bench Press"&&mainScheme) scheme=mainScheme.bench;
      if(ex.name==="Back Squat"&&mainScheme) scheme=mainScheme.squat;
      if(ex.name==="Deadlift"&&mainScheme) scheme=mainScheme.deadlift;
      if(ex.name==="Pull-ups"&&mainScheme) scheme=mainScheme.pullups;
      return h("div",{key:i,style:{padding:"8px 0",borderBottom:i<lt.exercises.length-1?"1px solid "+C.border:"none"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("span",{style:{fontWeight:isMain?700:500,color:isMain?C.text:C.textMuted}},ex.name),
          h("span",{style:{fontFamily:C.mono,fontSize:11,color:isMain?lt.color:C.textDim}},scheme?scheme.label:ex.sets)
        ),
        scheme?h("div",{style:{fontSize:12,color:lt.color,marginTop:2,opacity:0.8}},scheme.detail):null,
        h("div",{style:{fontSize:11,color:C.textDim,marginTop:2}},ex.note)
      );
    })
  );
}

function StrengthGoals() {
  var goals=[
    {name:"Bench",current:190,target:225,color:C.blue},
    {name:"Squat",current:250,target:315,color:C.orange},
    {name:"Deadlift",current:285,target:405,color:C.red},
    {name:"Pull-ups",current:20,target:30,color:C.purple,unit:"reps"},
  ];
  return h("div",{style:{marginBottom:20}},
    h("div",{style:{fontSize:11,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:C.textDim,marginBottom:10}},"Strength Targets"),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
      goals.map(function(g){
        var pct=Math.round(((g.current-0)/(g.target-0))*100);
        var unit=g.unit||"lbs";
        return h("div",{key:g.name,style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:"10px 12px"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}},
            h("span",{style:{fontSize:12,fontWeight:700,color:C.text}},g.name),
            h("span",{style:{fontSize:11,fontFamily:C.mono,color:g.color}},g.target+" "+unit)
          ),
          h("div",{style:{height:4,background:C.border,borderRadius:2,overflow:"hidden"}},
            h("div",{style:{height:"100%",width:pct+"%",background:g.color,borderRadius:2,transition:"width 0.3s"}})
          ),
          h("div",{style:{fontSize:10,color:C.textDim,marginTop:4,fontFamily:C.mono}},"Current: "+g.current+" "+unit+" ("+pct+"%)")
        );
      })
    )
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────
function App() {
  var s=useState;
  var sw=s(0),selWeek=sw[0],setSelWeek=sw[1];
  var st=s("plan"),tab=st[0],setTab=st[1];
  var se=s(null),expDay=se[0],setExpDay=se[1];
  var sl=s(null),logDay=sl[0],setLogDay=sl[1];
  var lg=s(ST.get()),logs=lg[0],setLogs=lg[1];

  var save=function(n){setLogs(n);ST.set(n)};
  var lk=function(w,d){return "w"+w+"-d"+d};
  var doSave=function(wi,di,data){var n=Object.assign({},logs);n[lk(wi,di)]=data;save(n);setLogDay(null)};
  var doDelete=function(wi,di){var n=Object.assign({},logs);delete n[lk(wi,di)];save(n);setLogDay(null)};
  var doReset=function(){if(confirm("Clear all workout logs?")){setLogs({});ST.clear()}};

  var week=getWeekPlan(selWeek);
  var totalLogged=Object.keys(logs).length;
  var totalPlanned=12*6;
  var totalMi=Object.values(logs).reduce(function(a,l){return a+(l.distance||0)},0);
  var weekDone=week.days.filter(function(_,i){return !!logs[lk(selWeek,i)]}).length;

  var typeColors={lift:{bg:"#1a1520",text:C.purple,border:C.purpleDim},run:{bg:"#0d2818",text:C.green,border:C.greenDim}};

  return h("div",null,
    // Header
    h("div",{style:{marginBottom:20}},
      h("div",{style:{fontSize:10,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:C.textDim,marginBottom:4,fontFamily:C.mono}},"Phase 1 \u2022 12 Weeks"),
      h("h1",{style:{fontSize:26,fontWeight:900,margin:0,lineHeight:1.1,color:C.text}},"Strength + Base"),
      h("div",{style:{fontSize:13,color:C.textMuted,marginTop:6}},"3 lift days \u2022 3 run days \u2022 Sundays off"),
      totalLogged>0?h("div",{style:{display:"flex",gap:16,marginTop:8,fontSize:11,fontFamily:C.mono,color:C.textDim}},
        h("span",null,h("span",{style:{color:C.accent}},totalLogged)," logged"),
        h("span",null,h("span",{style:{color:C.green}},totalMi.toFixed(1))," mi run"),
        h("span",null,h("span",{style:{color:C.blue}},Math.round((totalLogged/totalPlanned)*100)+"%")," done")
      ):null
    ),

    // Strength goals
    tab==="plan"?h(StrengthGoals):null,

    // Tabs
    h("div",{style:{display:"flex",gap:0,marginBottom:16,borderBottom:"1px solid "+C.border}},
      [{id:"plan",label:"Weekly Plan"},{id:"tendon",label:"Foot Care"},{id:"phase2",label:"Phase 2 Preview"}].map(function(t){
        return h("button",{key:t.id,onClick:function(){setTab(t.id)},style:{padding:"10px 16px",fontSize:12,fontWeight:tab===t.id?700:500,color:tab===t.id?C.accent:C.textDim,background:"none",border:"none",borderBottom:tab===t.id?"2px solid "+C.accent:"2px solid transparent",marginBottom:-1,letterSpacing:0.5}},t.label);
      })
    ),

    // PLAN TAB
    tab==="plan"?h("div",null,
      // Week selector
      h("div",{style:{display:"flex",gap:3,marginBottom:14,flexWrap:"wrap"}},
        Array.from({length:12}).map(function(_,i){
          var wp=getWeekPlan(i);
          var wd=wp.days.filter(function(_2,di){return !!logs[lk(i,di)]}).length;
          var all=wd===6;
          var isDeload=wp.phase==="Deload";
          return h("button",{key:i,onClick:function(){setSelWeek(i);setExpDay(null);setLogDay(null)},style:{
            flex:"1 0 auto",minWidth:50,padding:"7px 4px",fontSize:10,fontWeight:selWeek===i?700:500,
            background:selWeek===i?C.accent:all?C.greenBg:C.card,
            color:selWeek===i?"#111":all?C.green:isDeload?C.textDim:C.textMuted,
            border:"1px solid "+(selWeek===i?C.accent:all?C.greenDim:C.border),
            borderRadius:5,textAlign:"center",lineHeight:1.3,transition:"all 0.15s",fontFamily:C.mono
          }},
            h("div",null,"W"+wp.week),
            h("div",{style:{fontSize:9,opacity:0.7}},wd>0?(wd+"/6"):isDeload?"DL":(wp.runMiles+"mi"))
          );
        })
      ),

      // Week header
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}},
        h("div",null,
          h("span",{style:{fontSize:17,fontWeight:700,color:C.text}},"Week "+week.week),
          h("span",{style:{fontSize:10,fontWeight:600,color:week.phase==="Deload"?C.accent:week.block===1?C.green:week.block===2?C.blue:C.red,marginLeft:10,padding:"2px 8px",background:week.phase==="Deload"?C.accentDim+"30":week.block===1?C.greenDim+"40":week.block===2?C.blueDim+"40":C.redDim+"40",borderRadius:4,fontFamily:C.mono}},week.phase)
        ),
        h("div",{style:{fontSize:12,color:C.textDim,fontFamily:C.mono}},weekDone+"/6 \u2022 "+week.runMiles+" mi")
      ),

      // Mileage sparkline
      h("div",{style:{display:"flex",gap:2,alignItems:"flex-end",height:32,marginBottom:14}},
        Array.from({length:12}).map(function(_,i){
          var wp=getWeekPlan(i);
          var am=wp.days.reduce(function(a,_2,di){var l=logs[lk(i,di)];return a+(l?l.distance||0:0)},0);
          return h("div",{key:i,style:{flex:1,height:(wp.runMiles/22*100)+"%",background:selWeek===i?C.accent+"60":C.border,borderRadius:2,minHeight:3,position:"relative",overflow:"hidden"}},
            am>0?h("div",{style:{position:"absolute",bottom:0,left:0,right:0,height:Math.min(am/wp.runMiles*100,100)+"%",background:selWeek===i?C.green:C.greenDim,borderRadius:2}}):null
          );
        })
      ),

      // Days
      h("div",{style:{display:"flex",flexDirection:"column",gap:5}},
        week.days.map(function(d,i){
          var isLift=d.type==="lift";
          var tc=isLift?typeColors.lift:typeColors.run;
          var isExp=expDay===i;
          var isLog=logDay===i;
          var log=logs[lk(selWeek,i)];
          var done=!!log;
          var dayLabel=d.day||(isLift?"Lift":"Run");

          return h("div",{key:i,style:{background:done?C.greenBg:C.card,border:"1px solid "+(done?C.greenDim:isExp?tc.border:C.border),borderRadius:8,padding:"11px 12px",transition:"all 0.15s",borderLeft:done?"3px solid "+C.green:undefined}},
            h("div",{onClick:function(){setExpDay(isExp?null:i);if(isLog)setLogDay(null)},style:{display:"flex",alignItems:"center",gap:9,cursor:"pointer"}},
              done
                ?h("div",{style:{width:18,height:18,borderRadius:9,background:C.green,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},h("span",{style:{color:"#111",fontSize:11,lineHeight:1,fontWeight:700}},"\u2713"))
                :h("div",{style:{width:18,height:18,borderRadius:9,border:"2px solid "+C.borderLight,flexShrink:0}}),
              h("div",{style:{width:28,fontSize:11,fontWeight:600,color:C.textDim,fontFamily:C.mono}},dayLabel),
              h("span",{style:{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:3,background:tc.bg,color:tc.text,letterSpacing:0.5,textTransform:"uppercase",flexShrink:0,border:"1px solid "+tc.border}},isLift?"LIFT":"RUN"),
              h("div",{style:{fontSize:12,fontWeight:500,flex:1,color:done?"#999":C.text}},d.desc),
              d.miles>0?h("div",{style:{fontSize:11,fontWeight:600,color:C.textDim,flexShrink:0,fontFamily:C.mono}},d.miles+"mi"):null
            ),
            done&&!isExp?h("div",{style:{marginTop:5,marginLeft:28,display:"flex",gap:10,fontSize:10,color:C.textDim,fontFamily:C.mono}},
              log.distance>0?h("span",null,log.distance+"mi"):null,
              log.pace?h("span",null,log.pace):null,
              log.effort?h("span",{style:{textTransform:"capitalize"}},log.effort):null,
              log.notes?h("span",{style:{color:C.textDim,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},log.notes):null
            ):null,
            isExp?h("div",{style:{marginTop:10,paddingTop:10,borderTop:"1px solid "+C.border}},
              isLift?h(LiftDetail,{liftType:d.liftType,week:week.week}):h("div",{style:{fontSize:13,lineHeight:1.6,color:C.textMuted}},d.detail),
              done&&!isLog?h("div",{style:{background:"#0a1a10",borderRadius:6,padding:10,marginTop:10,marginBottom:10,border:"1px solid "+C.greenDim}},
                h("div",{style:{fontSize:10,fontWeight:700,color:C.green,marginBottom:5,textTransform:"uppercase",letterSpacing:1,fontFamily:C.mono}},"Logged"),
                h("div",{style:{display:"flex",gap:14,fontSize:12,color:C.textMuted,flexWrap:"wrap"}},
                  log.distance>0?h("div",null,h("strong",{style:{color:C.text}},log.distance)," mi"):null,
                  log.pace?h("div",null,h("strong",{style:{color:C.text}},log.pace)):null,
                  log.effort?h("div",{style:{textTransform:"capitalize"}},"Effort: ",h("strong",{style:{color:C.text}},log.effort)):null
                ),
                log.notes?h("div",{style:{fontSize:12,color:"#888",marginTop:5,fontStyle:"italic"}},'"'+log.notes+'"'):null,
                h("div",{style:{fontSize:9,color:C.textDim,marginTop:4,fontFamily:C.mono}},new Date(log.completedAt).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}))
              ):null,
              h("div",{style:{marginTop:8}},
                !isLog
                  ?h("button",{onClick:function(e){e.stopPropagation();setLogDay(i)},style:{padding:"7px 14px",fontSize:11,fontWeight:600,background:done?C.card:C.accent,color:done?C.textMuted:"#111",border:done?"1px solid "+C.borderLight:"none",borderRadius:5}},done?"Edit Log":"Log Workout")
                  :h(LogForm,{existing:log,onSave:function(data){doSave(selWeek,i,data)},onCancel:function(){setLogDay(null)},onDelete:function(){doDelete(selWeek,i)}})
              )
            ):null
          );
        })
      ),
      totalLogged>0?h("div",{style:{marginTop:16,textAlign:"right"}},h("button",{onClick:doReset,style:{fontSize:10,color:C.textDim,background:"none",border:"none",textDecoration:"underline"}},"Reset all logs")):null
    ):null,

    // TENDON TAB
    tab==="tendon"?h("div",null,
      h("h2",{style:{fontSize:18,fontWeight:700,marginBottom:14,color:C.text}},"Peroneal Tendonitis Management"),
      h("div",{style:{fontSize:13,lineHeight:1.7,color:C.textMuted}},
        h("p",{style:{marginBottom:12}},"The peroneal tendons run along the outside of your ankle and help stabilize your foot during running. Flare-ups typically come from too-rapid mileage increases, worn shoes, or running on cambered surfaces. Here\u2019s the protocol:"),

        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14,marginBottom:12}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Daily Rehab (5\u201310 min)"),
          h("div",{style:{color:"#999"}},
            "\u2022 Ankle circles: 20 each direction, each foot",h("br"),
            "\u2022 Towel scrunches: 3\u00d730 seconds (strengthens intrinsic foot muscles)",h("br"),
            "\u2022 Single-leg balance: 3\u00d730 seconds each foot (on pillow for challenge)",h("br"),
            "\u2022 Resistance band eversion: 3\u00d715 each foot (key peroneal strengthener)",h("br"),
            "\u2022 Eccentric calf raises off a step: 3\u00d715 (slow 3-sec lower)"
          )
        ),

        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14,marginBottom:12}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Pain Rules"),
          h("div",{style:{color:"#999"}},
            "\u2022 ",h("strong",{style:{color:C.text}},"0\u20132/10 during run")," \u2192 OK to continue",h("br"),
            "\u2022 ",h("strong",{style:{color:C.accent}},"3\u20134/10 during run")," \u2192 Stop, walk home, ice",h("br"),
            "\u2022 ",h("strong",{style:{color:C.red}},"Pain increases day after run")," \u2192 Take 2\u20133 days off running, keep doing rehab exercises",h("br"),
            "\u2022 ",h("strong",{style:{color:C.red}},"Pain at rest or while walking")," \u2192 See a sports PT"
          )
        ),

        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14,marginBottom:12}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.green,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Recovery Tools"),
          h("div",{style:{color:"#999"}},
            "\u2022 Ice the outer ankle for 15 min after every run",h("br"),
            "\u2022 Roll the peroneal area with a lacrosse ball (lateral lower leg)",h("br"),
            "\u2022 Consider a compression ankle sleeve for runs",h("br"),
            "\u2022 Check shoe wear \u2014 if >400 miles, replace them",h("br"),
            "\u2022 Avoid cambered roads; run on flat surfaces or track"
          )
        ),

        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.orange,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Supplement Support"),
          h("div",{style:{color:"#999"}},
            "Your existing supplement stack helps here: ",h("strong",{style:{color:C.text}},"omega-3s")," reduce tendon inflammation, ",h("strong",{style:{color:C.text}},"magnesium glycinate")," supports muscle relaxation and recovery, and ",h("strong",{style:{color:C.text}},"zinc carnosine")," aids tissue repair. Consider adding ",h("strong",{style:{color:C.accent}},"collagen peptides (15g)")," with ",h("strong",{style:{color:C.accent}},"vitamin C")," 30\u201360 min before exercise \u2014 research shows this combination increases collagen synthesis in tendons."
          )
        )
      )
    ):null,

    // PHASE 2 PREVIEW
    tab==="phase2"?h("div",null,
      h("h2",{style:{fontSize:18,fontWeight:700,marginBottom:14,color:C.text}},"Phase 2: Marathon Build"),
      h("div",{style:{fontSize:13,lineHeight:1.7,color:C.textMuted}},
        h("div",{style:{background:C.card,border:"1px solid "+C.accent+"40",borderRadius:8,padding:14,marginBottom:14}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Timeline"),
          h("div",{style:{color:"#999"}},"Phase 2 starts after you complete these 12 weeks (~late July/early August). It\u2019s a 12\u201314 week marathon-specific build targeting a ",h("strong",{style:{color:C.text}},"fall race in October or November"),"."),
          h("div",{style:{marginTop:8,color:"#999"}},"Target races to research closer to the date: REVEL Big Cottonwood (Sat, Sep 12, SLC), St. George Marathon (Oct, lottery), California International Marathon (Dec 7, Sacramento), or The Original Las Vegas Marathon (Oct 11, Henderson).")
        ),
        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14,marginBottom:14}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.green,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Structure"),
          h("div",{style:{color:"#999"}},
            "\u2022 Running increases to 4\u20135 days/week with long runs building to 20 mi",h("br"),
            "\u2022 Lifting drops to 2 days/week (upper + lower maintenance)",h("br"),
            "\u2022 Tempo runs and intervals reintroduce race-pace work",h("br"),
            "\u2022 3-week taper before race day",h("br"),
            "\u2022 Your strength base from Phase 1 will make you a more injury-resistant, more powerful runner"
          )
        ),
        h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:14}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontFamily:C.mono}},"Entry Requirements"),
          h("div",{style:{color:"#999"}},
            "Before starting Phase 2, you should be able to:",h("br"),
            "\u2022 Run 10\u201311 miles pain-free",h("br"),
            "\u2022 Run 3 days/week at 18\u201320 mi/week consistently",h("br"),
            "\u2022 Complete a 4-mile tempo at ~9:00 pace",h("br"),
            "\u2022 No peroneal tendon flare-ups for at least 3 weeks",h("br"),h("br"),
            "If you\u2019re not there yet at week 12, we extend Phase 1. No rush \u2014 the marathon isn\u2019t going anywhere."
          )
        )
      )
    ):null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
