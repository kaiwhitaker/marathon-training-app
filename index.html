const FUELING = { title:"Nutrition & Fueling Protocol", sections:[
  { name:"During Long Runs (>60 min)", items:["30–60g carbs per hour after the first 45 minutes","Options: energy gels (GU, Maurten, SiS), chews (Clif Bloks), or even gummy bears","Wash down each gel with 4–6 oz of water — not sports drink (double sugar = GI distress)","Practice every long run. Never try new fuel on race day."]},
  { name:"Pre-Run (60–90 min before)", items:["200–300 calories of easy-to-digest carbs: toast w/ honey, banana, oatmeal, rice cake","8–12 oz water. Small amount of coffee is fine if you're used to it.","Avoid high fiber, fat, or protein close to run time."]},
  { name:"Daily Nutrition", items:["Carbs are your fuel: 3–5g/kg bodyweight on easy days, 5–7g/kg on hard/long days","Protein: 1.4–1.7g/kg for recovery and muscle maintenance","Don't skimp on sodium — you lose 500–1500mg per hour of running in heat","Hydrate to thirst. Aim for pale yellow urine as a general gauge."]},
  { name:"Race Week Carb Load", items:["3 days out: increase carbs to 7–10g/kg bodyweight per day","This is not just 'eat pasta' — it's rice, bread, potatoes, juice, pretzels all day","Reduce fiber and fat to make room for carbs without overeating total volume","Pre-race dinner: familiar, carb-heavy, low-fiber. White rice + chicken is a classic."]},

const RACE_STRATEGY = { title:"Race Day Execution Plan",
  paces:[
    { segment:"Miles 1–6", pace:"9:15–9:20", note:"Bank patience, not time. The first 10K should feel too easy." },
    { segment:"Miles 7–13", pace:"9:00–9:10", note:"Settle into marathon pace. You should feel strong and controlled." },

  ],
  fuel:"Gel or chews at miles 4, 8, 12, 16, 20, 23. Water at every aid station. Sports drink alternating with water."

const TC = { Easy:{bg:"#E8F5E9",text:"#2E7D32",border:"#A5D6A7"}, Tempo:{bg:"#FFF3E0",text:"#E65100",border:"#FFCC02"}, Intervals:{bg:"#FCE4EC",text:"#C62828",border:"#EF9A9A"}, "Long Run":{bg:"#E3F2FD",text:"#1565C0",border:"#90CAF9"}, "Rest/Lift":{bg:"#F3E5F5",text:"#6A1B9A",border:"#CE93D8"}, Rest:{bg:"#ECEFF1",text:"#546E7A",border:"#B0BEC5"}, Race:{bg:"#FFF9C4",text:"#F57F17",border:"#FFF176"} };

// ─── STORAGE ─────────────────────────────────────────────────────────
const store = {
  get() { try { return JSON.parse(localStorage.getItem("marathon-logs") || "{}"); } catch(e) { return {}; } },
  set(logs) { try { localStorage.setItem("marathon-logs", JSON.stringify(logs)); } catch(e) {} },
  clear() { try { localStorage.removeItem("marathon-logs"); } catch(e) {} },
};

// ─── LOG FORM ────────────────────────────────────────────────────────
function LogForm({ existing, onSave, onCancel, onDelete }) {
  const [dist, setDist] = useState(existing ? existing.distance : "");
  const [pace, setPace] = useState(existing ? existing.pace : "");
  const [effort, setEffort] = useState(existing ? existing.effort : "moderate");
  const [notes, setNotes] = useState(existing ? existing.notes : "");

  const inp = { width:"100%", padding:"8px 10px", fontSize:13, border:"1px solid #ddd", borderRadius:6, boxSizing:"border-box", background:"#fafafa" };
  const lbl = { fontSize:11, fontWeight:600, color:"#888", marginBottom:4, display:"block", textTransform:"uppercase", letterSpacing:0.8 };

  return h("div", { style:{ marginTop:12, paddingTop:12, borderTop:"1px dashed #ddd" }, onClick:function(e){e.stopPropagation()} },
    h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 } },
      h("div", null, h("label", { style:lbl }, "Distance (mi)"), h("input", { type:"number", step:"0.1", placeholder:"0.0", value:dist, onChange:function(e){setDist(e.target.value)}, style:inp })),
      h("div", null, h("label", { style:lbl }, "Avg Pace (min/mi)"), h("input", { type:"text", placeholder:"9:27", value:pace, onChange:function(e){setPace(e.target.value)}, style:inp })),
    ),
    h("div", { style:{ marginBottom:10 } },
      h("label", { style:lbl }, "Effort"),
      h("div", { style:{ display:"flex", gap:6 } },
        ["easy","moderate","hard","max"].map(function(e) {
          return h("button", { key:e, onClick:function(){setEffort(e)}, style:{ flex:1, padding:"6px 0", fontSize:11, fontWeight:effort===e?700:500, border:effort===e?"2px solid #1a1a1a":"1px solid #ddd", borderRadius:5, background:effort===e?"#1a1a1a":"#fff", color:effort===e?"#fff":"#666", textTransform:"capitalize" } }, e);
        })
      )
    ),
    h("div", { style:{ marginBottom:12 } },
      h("label", { style:lbl }, "Notes"),
      h("textarea", { placeholder:"How did it feel?", value:notes, onChange:function(e){setNotes(e.target.value)}, style:Object.assign({}, inp, { minHeight:56, resize:"vertical" }) })
    ),
    h("div", { style:{ display:"flex", gap:8 } },
      h("button", { onClick:function(){ onSave({ distance:parseFloat(dist)||0, pace:pace, effort:effort, notes:notes, completedAt:existing?existing.completedAt:new Date().toISOString() }) }, style:{ flex:1, padding:"9px 0", fontSize:13, fontWeight:700, background:"#2E7D32", color:"#fff", border:"none", borderRadius:6 } }, existing ? "Update" : "Log Workout"),
      existing ? h("button", { onClick:onDelete, style:{ padding:"9px 14px", fontSize:13, fontWeight:600, background:"#fff", color:"#C62828", border:"1px solid #EF9A9A", borderRadius:6 } }, "Remove") : null,
      h("button", { onClick:onCancel, style:{ padding:"9px 14px", fontSize:13, fontWeight:500, background:"#f5f5f5", color:"#666", border:"none", borderRadius:6 } }, "Cancel")
    )
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────
function App() {
  const [selWeek, setSelWeek] = useState(0);
  const [tab, setTab] = useState("plan");
  const [expDay, setExpDay] = useState(null);
  const [logDay, setLogDay] = useState(null);
  const [logs, setLogs] = useState(store.get());

  var save = function(n) { setLogs(n); store.set(n); };
  var lk = function(w,d) { return "w"+w+"-d"+d; };
  var doSave = function(wi,di,data) { var n = Object.assign({}, logs); n[lk(wi,di)] = data; save(n); setLogDay(null); };
  var doDelete = function(wi,di) { var n = Object.assign({}, logs); delete n[lk(wi,di)]; save(n); setLogDay(null); };
  var doReset = function() { if(confirm("Clear all workout logs? This can't be undone.")) { setLogs({}); store.clear(); } };

  var week = WEEKS[selWeek];
  var totalLogged = Object.keys(logs).length;
  var totalPlanned = WEEKS.reduce(function(a,w){return a+w.days.length},0);
  var totalMi = Object.values(logs).reduce(function(a,l){return a+(l.distance||0)},0);
  var weekDone = week.days.filter(function(_,i){return !!logs[lk(selWeek,i)]}).length;

  return h("div", null,
    // Header
    h("div", { style:{ marginBottom:24 } },
      h("div", { style:{ fontSize:11, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", color:"#999", marginBottom:4 } }, "10-Week Program"),
      h("h1", { style:{ fontSize:28, fontWeight:900, margin:0, lineHeight:1.1 } }, "Sub-4:00 Marathon"),
      h("div", { style:{ fontSize:14, color:"#666", marginTop:6 } }, "Target pace: 9:09/mi \u2022 Peak mileage: 44 mi/wk \u2022 5 runs/wk"),
      totalLogged > 0 ? h("div", { style:{ display:"flex", gap:16, marginTop:10, fontSize:12, color:"#888" } },
        h("span", null, h("strong", { style:{color:"#2E7D32"} }, totalLogged), " logged"),
        h("span", null, h("strong", { style:{color:"#1565C0"} }, totalMi.toFixed(1)), " mi run"),
        h("span", null, h("strong", { style:{color:"#E65100"} }, Math.round((totalLogged/totalPlanned)*100)+"%"), " complete"),
      ) : null
    ),

    // Tabs
    h("div", { style:{ display:"flex", gap:0, marginBottom:20, borderBottom:"2px solid #e0e0e0" } },
      [{id:"plan",label:"Training Plan"},{id:"fuel",label:"Fueling"},{id:"race",label:"Race Strategy"}].map(function(t) {
        return h("button", { key:t.id, onClick:function(){setTab(t.id)}, style:{ padding:"10px 20px", fontSize:13, fontWeight:tab===t.id?700:500, color:tab===t.id?"#1a1a1a":"#888", background:"none", border:"none", borderBottom:tab===t.id?"2px solid #1a1a1a":"2px solid transparent", marginBottom:-2 } }, t.label);
      })
    ),

    // PLAN TAB
    tab === "plan" ? h("div", null,
      // Week selector
      h("div", { style:{ display:"flex", gap:4, marginBottom:16, flexWrap:"wrap" } },
        WEEKS.map(function(w,i) {
          var wd = w.days.filter(function(_,di){return !!logs[lk(i,di)]}).length;
          var all = wd === w.days.length;
          return h("button", { key:i, onClick:function(){setSelWeek(i);setExpDay(null);setLogDay(null)}, style:{ width:56, padding:"8px 4px", fontSize:11, fontWeight:selWeek===i?700:500, background:selWeek===i?"#1a1a1a":all?"#E8F5E9":"#f5f5f5", color:selWeek===i?"#fff":all?"#2E7D32":"#666", border:all&&selWeek!==i?"1px solid #A5D6A7":"1px solid transparent", borderRadius:6, textAlign:"center", lineHeight:1.3, transition:"all 0.15s" } },
            h("div", null, "Wk "+w.week),
            h("div", { style:{fontSize:10,opacity:0.7} }, wd>0?(wd+"/7"):(w.totalMiles+" mi"))
          );
        })
      ),
      // Week header
      h("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:12 } },
        h("div", null,
          h("span", { style:{fontSize:18,fontWeight:700} }, "Week "+week.week),
          h("span", { style:{ fontSize:11, fontWeight:600, color:PC[week.phase], marginLeft:10, padding:"3px 8px", background:PC[week.phase]+"18", borderRadius:4 } }, week.phase)
        ),
        h("div", { style:{fontSize:13,color:"#888"} }, h("strong", null, weekDone+"/7"), " done \u2022 ", h("strong", {style:{color:"#666"}}, week.totalMiles+" mi"))
      ),
      // Sparkline
      h("div", { style:{ display:"flex", gap:3, alignItems:"flex-end", height:40, marginBottom:16 } },
        WEEKS.map(function(w,i) {
          var am = w.days.reduce(function(a,_,di){return a+(logs[lk(i,di)]?logs[lk(i,di)].distance||0:0)},0);
          return h("div", { key:i, style:{ flex:1, height:(w.totalMiles/44*100)+"%", background:selWeek===i?"#1a1a1a":"#e0e0e0", borderRadius:2, transition:"all 0.2s", minHeight:4, position:"relative", overflow:"hidden" } },
            am > 0 ? h("div", { style:{ position:"absolute", bottom:0, left:0, right:0, height:Math.min(am/w.totalMiles*100,100)+"%", background:selWeek===i?"#4CAF50":"#A5D6A7", borderRadius:2, transition:"all 0.3s" } }) : null
          );
        })
      ),
      // Days
      h("div", { style:{ display:"flex", flexDirection:"column", gap:6 } },
        week.days.map(function(d,i) {
          var colors = TC[d.type] || TC.Rest;
          var isExp = expDay === i;
          var isLog = logDay === i;
          var log = logs[lk(selWeek,i)];
          var done = !!log;

          return h("div", { key:i, style:{ background:done?"#FAFFF9":"#fff", border:"1px solid "+(done?"#C8E6C9":isExp?colors.border:"#e8e8e8"), borderRadius:8, padding:"12px 14px", transition:"all 0.15s", borderLeft:done?"3px solid #4CAF50":undefined } },
            // Row
            h("div", { onClick:function(){setExpDay(isExp?null:i);if(isLog)setLogDay(null)}, style:{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" } },
              done
                ? h("div", { style:{ width:20,height:20,borderRadius:10,background:"#4CAF50",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 } }, h("span", { style:{color:"#fff",fontSize:12,lineHeight:1} }, "\u2713"))
                : h("div", { style:{ width:20,height:20,borderRadius:10,border:"2px solid #ddd",flexShrink:0 } }),
              h("div", { style:{width:30,fontSize:12,fontWeight:600,color:"#999"} }, d.day),
              h("span", { style:{ fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:3,background:colors.bg,color:colors.text,letterSpacing:0.5,textTransform:"uppercase",flexShrink:0,opacity:done?0.7:1 } }, d.type),
              h("div", { style:{fontSize:13,fontWeight:500,flex:1,color:done?"#555":"#1a1a1a"} }, d.desc),
              d.miles > 0 ? h("div", { style:{fontSize:12,fontWeight:600,color:"#999",flexShrink:0} }, d.miles+" mi") : null
            ),
            // Compact log preview
            done && !isExp ? h("div", { style:{marginTop:6,marginLeft:30,display:"flex",gap:12,fontSize:11,color:"#888"} },
              log.distance>0 ? h("span",null,log.distance+" mi") : null,
              log.pace ? h("span",null,log.pace+"/mi") : null,
              log.effort ? h("span",{style:{textTransform:"capitalize"}},log.effort) : null,
              log.notes ? h("span",{style:{color:"#aaa",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},log.notes) : null
            ) : null,
            // Expanded detail
            isExp ? h("div", { style:{marginTop:10,paddingTop:10,borderTop:"1px solid #f0f0f0"} },
              h("div", { style:{fontSize:13,lineHeight:1.6,color:"#555",marginBottom:10} }, d.detail),
              done && !isLog ? h("div", { style:{background:"#f8f9f8",borderRadius:6,padding:10,marginBottom:10} },
                h("div", { style:{fontSize:11,fontWeight:700,color:"#2E7D32",marginBottom:6,textTransform:"uppercase",letterSpacing:0.8} }, "Workout Log"),
                h("div", { style:{display:"flex",gap:16,fontSize:13,color:"#555",flexWrap:"wrap"} },
                  log.distance>0?h("div",null,h("strong",null,log.distance)," mi"):null,
                  log.pace?h("div",null,h("strong",null,log.pace),"/mi"):null,
                  log.effort?h("div",{style:{textTransform:"capitalize"}},"Effort: ",h("strong",null,log.effort)):null
                ),
                log.notes?h("div",{style:{fontSize:13,color:"#666",marginTop:6,fontStyle:"italic"}},'"'+log.notes+'"'):null,
                h("div",{style:{fontSize:10,color:"#bbb",marginTop:4}},new Date(log.completedAt).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}))
              ) : null,
              !isLog
                ? h("button", { onClick:function(e){e.stopPropagation();setLogDay(i)}, style:{ padding:"8px 16px",fontSize:12,fontWeight:600,background:done?"#f5f5f5":"#1a1a1a",color:done?"#666":"#fff",border:done?"1px solid #ddd":"none",borderRadius:6 } }, done?"Edit Log":"Log Workout")
                : h(LogForm, { existing:log, onSave:function(data){doSave(selWeek,i,data)}, onCancel:function(){setLogDay(null)}, onDelete:function(){doDelete(selWeek,i)} })
            ) : null
          );
        })
      ),
      totalLogged>0 ? h("div",{style:{marginTop:20,textAlign:"right"}},h("button",{onClick:doReset,style:{fontSize:11,color:"#bbb",background:"none",border:"none",textDecoration:"underline"}},"Reset all logs")) : null
    ) : null,

    // FUELING TAB
    tab === "fuel" ? h("div", null,
      h("h2", { style:{fontSize:20,fontWeight:700,marginBottom:16} }, FUELING.title),
      FUELING.sections.map(function(s,i) {
        return h("div", { key:i, style:{marginBottom:20} },
          h("h3", { style:{fontSize:14,fontWeight:700,marginBottom:8,color:"#333"} }, s.name),
          s.items.map(function(item,j) {
            return h("div", { key:j, style:{fontSize:13,lineHeight:1.6,color:"#555",paddingLeft:14,marginBottom:4,position:"relative"} },
              h("span", { style:{position:"absolute",left:0,color:"#ccc"} }, "\u2022"), item
            );
          })
        );
      }),
      h("div", { style:{marginTop:20,padding:14,background:"#FFF8E1",borderRadius:8,border:"1px solid #FFE082",fontSize:13,lineHeight:1.6,color:"#6D4C00"} },
        h("strong", null, "Your 11.8-mile lesson:"), " You bonked because you ran 90+ minutes on just a glass of water. With proper fueling, that same effort gets you to 13.1 and beyond."
      )
    ) : null,

    // RACE STRATEGY TAB
    tab === "race" ? h("div", null,
      h("h2", { style:{fontSize:20,fontWeight:700,marginBottom:16} }, RACE_STRATEGY.title),
      h("div", { style:{fontSize:13,color:"#555",marginBottom:16,lineHeight:1.6} }, "The #1 mistake in a marathon is going out too fast. Start slower than you think you should. The race begins at mile 20."),
      RACE_STRATEGY.paces.map(function(p,i) {
        return h("div", { key:i, style:{display:"flex",gap:14,padding:"12px 0",borderBottom:i<RACE_STRATEGY.paces.length-1?"1px solid #f0f0f0":"none",alignItems:"flex-start"} },
          h("div", { style:{width:90,flexShrink:0} },
            h("div", { style:{fontSize:13,fontWeight:700} }, p.segment),
            h("div", { style:{fontSize:16,fontWeight:300,color:"#1565C0",marginTop:2} }, p.pace)
          ),
          h("div", { style:{fontSize:13,color:"#555",lineHeight:1.5,paddingTop:2} }, p.note)
        );
      }),
      h("div", { style:{marginTop:20,padding:14,background:"#E8F5E9",borderRadius:8,border:"1px solid #A5D6A7",fontSize:13,lineHeight:1.6,color:"#1B5E20"} }, h("strong",null,"Fuel stations: "), RACE_STRATEGY.fuel),
      h("div", { style:{marginTop:12,padding:14,background:"#F3E5F5",borderRadius:8,border:"1px solid #CE93D8",fontSize:13,lineHeight:1.6,color:"#4A148C"} }, h("strong",null,"Target finish: "), "~3:55:00. That gives you a 5-minute buffer under 4:00.")
    ) : null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
